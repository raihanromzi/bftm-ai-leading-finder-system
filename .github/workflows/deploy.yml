name: Development CI and Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build

  backend-ci:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py app/config.py app/database.py app/models.py app/seed_branches.py app/services/product_matching.py app/routers/health.py app/routers/branches.py app/routers/discover.py app/routers/leads.py
      - run: python -c "from app.services.product_matching import match_product; assert match_product('school')['fit_score'] == 85; assert match_product('cafe')['fit_score'] == 70"

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@66.1.0
      - run: vercel pull --yes --environment=development --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      - name: Output deployment URL
        run: echo "🚀 Frontend deployed to ${{ steps.deploy.outputs.url }}"
